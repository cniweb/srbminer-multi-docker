name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    permissions:
      contents: read
      packages: read
      id-token: none
      attestations: none

    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Make scripts executable
        run: chmod +x ./build.sh ./security-check.sh

      - name: Build image (build-only, no push)
        run: ./build.sh build-only

      - name: Extract version from build.sh
        id: get_version
        run: |
          VERSION=$(grep '^version=' build.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Validate image --version
        run: docker run --rm "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}" --version

      - name: Validate image via entrypoint bypass
        run: docker run --rm --entrypoint="" "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}" ./SRBMiner-MULTI --version

      - name: Run security-check.sh
        run: ./security-check.sh "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}"

  docker:
    name: Push images
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build script (builds Docker image)
        run: ./build.sh build-only

      - name: Extract version from build.sh
        id: get_version
        run: |
          VERSION=$(grep '^version=' build.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Validate image before push
        run: |
          docker run --rm "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}" --version
          docker run --rm --entrypoint="" "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}" ./SRBMiner-MULTI --version

      - name: Run security-check.sh
        run: |
          chmod +x ./security-check.sh
          ./security-check.sh "docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}"

      - name: Tag Docker image with latest, version, and commit SHA
        run: |
          # Tag for Docker Hub
          docker tag docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} docker.io/cniweb/srbminer-multi:latest
          docker tag docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} docker.io/cniweb/srbminer-multi:${{ github.sha }}

          # Tag for GitHub Container Registry
          docker tag docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} ghcr.io/cniweb/srbminer-multi:latest
          docker tag docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} ghcr.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}
          docker tag docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} ghcr.io/cniweb/srbminer-multi:${{ github.sha }}


      - name: Push Docker images to all registries
        id: push
        run: |
          # Push to Docker Hub
          docker push docker.io/cniweb/srbminer-multi:latest
          docker push docker.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}
          docker push docker.io/cniweb/srbminer-multi:${{ github.sha }}

          # Push to GitHub Container Registry
          docker push ghcr.io/cniweb/srbminer-multi:latest
          docker push ghcr.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }}
          docker push ghcr.io/cniweb/srbminer-multi:${{ github.sha }}


          # Capture the GHCR-specific digest for attestation/SBOM
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' ghcr.io/cniweb/srbminer-multi:${{ steps.get_version.outputs.version }} | grep '^ghcr.io/cniweb/srbminer-multi@' | head -n1 | cut -d'@' -f2)
          if [ -z "$DIGEST" ]; then
            echo "Could not determine ghcr.io digest for cniweb/srbminer-multi" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/cniweb/srbminer-multi
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/cniweb/srbminer-multi@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/cniweb/srbminer-multi
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const tag = `v${version}`;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 50,
            });

            const previous = releases.find(r => !r.draft && !r.prerelease && r.tag_name !== tag);

            let name = `SRBMiner-Multi Docker v${version}`;
            let body = `## SRBMiner-Multi Docker Image v${version}\n\nDocker images successfully built and pushed to:\n- Docker Hub: \`docker.io/cniweb/srbminer-multi:${version}\`\n- GitHub Container Registry: \`ghcr.io/cniweb/srbminer-multi:${version}\`\n\n### Usage\n\`\`\`bash\ndocker pull cniweb/srbminer-multi:${version}\n\`\`\`\n\nBased on [SRBMiner-Multi ${version}](https://github.com/doktor83/SRBMiner-Multi/releases/tag/${version})`;

            if (previous) {
              const oldTag = previous.tag_name || "";
              const oldVersion = oldTag.replace(/^v/, "");
              const tagRegex = oldTag ? new RegExp(oldTag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g") : null;
              const versionRegex = oldVersion ? new RegExp(oldVersion.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g") : null;

              name = previous.name && previous.name.trim().length > 0 ? previous.name : name;
              body = previous.body && previous.body.trim().length > 0 ? previous.body : body;

              if (tagRegex) {
                name = name.replace(tagRegex, tag);
                body = body.replace(tagRegex, tag);
              }
              if (versionRegex) {
                name = name.replace(versionRegex, version);
                body = body.replace(versionRegex, version);
              }
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name,
              body,
              draft: false,
              prerelease: false,
            });
